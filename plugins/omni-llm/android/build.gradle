// وحدة مكتبة أندرويد للبلاجن. AGP و Kotlin يضيفهما APKMaker في build.gradle الجذر.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.dark.omnillm"
    compileSdk rootProject.ext.compileSdkVersion

    // NDK/CMake: تُثبَّت صراحةً في الـworkflow (خطوة «تجهيز NDK وCMake») قبل Gradle.
    // لتغيير الإصدار محلياً: -PomniLlmNdk=<ver> ، -PomniLlmCmake=<ver>
    ndkVersion = (project.findProperty('omniLlmNdk') ?: '27.2.12479018') as String

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            // llama.cpp يدعم رسمياً على أندرويد: arm64-v8a (الهواتف) و x86_64 (المحاكي). armeabi-v7a غير مدعوم من llama.cpp
            // (لا يوجد في CI الخاص به): على الأجهزة 32-بت يعلن البلاجن «OmniLlm unavailable» بدل أن يكسر البناء أو يتعطل.
            // للمحاكي أضف x86_64 عبر: -PomniLlmAbis=arm64-v8a,x86_64
            abiFilters.addAll(((project.findProperty('omniLlmAbis') ?: 'arm64-v8a') as String).split(',').collect { it.trim() })
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = (project.findProperty('omniLlmCmake') ?: '3.22.1') as String
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.darkJava
        targetCompatibility rootProject.ext.darkJava
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.darkJava.toString()
    }
}

dependencies {
    implementation project(':capacitor-android')
}
