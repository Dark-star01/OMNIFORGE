// وحدة مكتبة أندرويد للبلاجن. AGP و Kotlin يضيفهما APKMaker في build.gradle الجذر.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.dark.omninative"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility rootProject.ext.darkJava
        targetCompatibility rootProject.ext.darkJava
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.darkJava.toString()
    }
}

dependencies {
    implementation project(':capacitor-android')
    // يوفّر androidx.activity (ActivityResult) المستخدم لاختيار الملفات/المجلدات
    implementation "androidx.appcompat:appcompat:${rootProject.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'}"
    // توقيع APK والتحقق منه (Apache-2.0). حجمه ≈ 300KB.
    implementation "com.android.tools.build:apksig:8.7.3"
}
