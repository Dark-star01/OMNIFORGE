// وحدة مكتبة أندرويد للبلاجن. لا نضع buildscript هنا:
// أداة البناء تضيف AGP و Kotlin و darkJava في build.gradle الجذر تلقائياً.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.dark.omnivideo"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility rootProject.ext.darkJava
        targetCompatibility rootProject.ext.darkJava
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.darkJava.toString()
    }
}

dependencies {
    implementation project(':capacitor-android')

    // محرك الاستخراج: yt-dlp + Python مضمّنان (ترخيص GPL-3.0 للمكتبة — راجع README)
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    // FFmpeg لدمج الصوت والفيديو وتحويل الصوت (مفصول عن library عمداً)
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
}
